name: Test Release Notes Generation

on:
  workflow_dispatch:
    inputs:
      previous_tag:
        description: 'Previous tag to compare against'
        required: true
        default: 'v1.16.18'
      test_case:
        description: 'Test case to run'
        required: true
        default: 'v1.16.19'
        type: choice
        options:
          - v1.16.19
          - v1.16.9
          - custom

jobs:
  test-release-notes:
    name: 'Test Release Notes Generation'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 100
          fetch-tags: true

      - name: Debug Git Information
        run: |
          echo "=== Git Debug Information ==="
          echo "Current HEAD: $(git rev-parse HEAD)"
          echo "Current branch: $(git branch --show-current)"
          echo "Total commits: $(git rev-list --count HEAD)"
          echo "Total tags: $(git tag | wc -l)"
          echo ""
          echo "Recent tags:"
          git tag | tail -10
          echo ""
          echo "Commits between ${{ inputs.previous_tag }} and HEAD:"
          git log --oneline ${{ inputs.previous_tag }}..HEAD | head -10
          echo ""

      - name: Test Release Notes Generation
        id: release_notes
        uses: InjectiveLabs/github-fe/actions/release-note@master
        with:
          previous_tag: ${{ inputs.previous_tag }}
          repo_url: 'https://github.com/InjectiveLabs/injective-helix'

      - name: Display Results
        run: |
          echo "=== Release Notes Results ==="
          echo "New version: ${{ steps.release_notes.outputs.new_version }}"
          echo "Bugsnag version: ${{ steps.release_notes.outputs.bugsnag_version }}"
          echo ""
          echo "Generated release notes:"
          echo "${{ steps.release_notes.outputs.release_notes }}"
          echo ""

      - name: Validate Expected Commits
        if: inputs.test_case == 'v1.16.19'
        run: |
          echo "=== Validating v1.16.19 Expected Commits ==="
          expected_commits=("ef16b874c975f055f998c9ce201a031d0d2edd87" "db52d12fd2436c79138c17b1edd3c1597dc80f86" "482e9e108a13360ec690207ebbf9b8c3c2e39f39")

          for commit in "${expected_commits[@]}"; do
            if git rev-parse --verify "$commit" >/dev/null 2>&1; then
              echo "✅ Found expected commit: $commit"
              git log --oneline -1 "$commit"
            else
              echo "❌ Missing expected commit: $commit"
            fi
          done
          echo ""

      - name: Test Different Git Log Commands
        run: |
          echo "=== Testing Different Git Log Commands ==="
          echo ""
          echo "1. Commits with merges:"
          git log ${{ inputs.previous_tag }}..HEAD --pretty=format:"%H|%s|%an|%ae" | head -5
          echo ""
          echo "2. Commits without merges:"
          git log ${{ inputs.previous_tag }}..HEAD --no-merges --pretty=format:"%H|%s|%an|%ae" | head -5
          echo ""
          echo "3. Commit count with merges: $(git log ${{ inputs.previous_tag }}..HEAD --pretty=format:"%H" | wc -l)"
          echo "4. Commit count without merges: $(git log ${{ inputs.previous_tag }}..HEAD --no-merges --pretty=format:"%H" | wc -l)"
